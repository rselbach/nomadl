<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nomadl - Nomad Log Explorer</title>
    <script src="/htmx.min.js"></script>
    <style>
        :root {
            --bg-primary: #1a1b26;
            --bg-secondary: #24283b;
            --bg-tertiary: #2d3149;
            --text-primary: #c0caf5;
            --text-secondary: #9dabd6;
            --text-muted: #565f89;
            --accent: #7aa2f7;
            --border: #3b4261;
            --error: #f7768e;
            --warn: #e0af68;
            --info: #7dcfff;
            --debug: #9ece6a;
            --trace: #bb9af7;
            --success: #9ece6a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            overflow: hidden;
            height: 100vh;
        }

        #app { display: flex; flex-direction: column; height: 100vh; }

        #topbar {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 16px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }

        .logo { font-size: 18px; font-weight: 700; color: var(--accent); margin-right: 8px; }

        #search-form { display: flex; gap: 8px; align-items: center; flex: 1; }

        .search-input {
            flex: 1; max-width: 400px; padding: 6px 12px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-primary); font-size: 13px;
        }
        .search-input:focus { outline: none; border-color: var(--accent); }

        .filter-select {
            padding: 6px 8px; background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-primary); font-size: 13px;
        }

        .btn-clear, .btn-stop-tail {
            padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-primary); cursor: pointer; font-size: 13px;
        }
        .btn-clear:hover, .btn-stop-tail:hover { background: var(--border); }
        .btn-stop-tail { color: var(--error); }

        .table-options-wrap { position: relative; flex-shrink: 0; }
        .table-options-menu[hidden] { display: none; }
        .table-options-menu {
            position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
            width: 260px; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 6px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
            overflow: visible;
        }
        .table-options-menu::before {
            content: ""; position: absolute; top: -7px; right: 26px;
            width: 12px; height: 12px; transform: rotate(45deg);
            background: var(--bg-secondary); border-left: 1px solid var(--border);
            border-top: 1px solid var(--border);
        }
        .table-options-title {
            padding: 10px 14px; color: var(--text-muted); font-size: 11px;
            font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        .table-option-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 11px 14px; color: var(--text-primary);
            border-bottom: 1px solid rgba(59, 66, 97, 0.7); cursor: pointer;
        }
        .table-option-row:last-child { border-bottom: 0; }
        .table-option-row:hover { background: var(--bg-tertiary); }
        .table-option-toggle {
            appearance: none; position: relative; width: 38px; height: 22px;
            border-radius: 999px; background: var(--border); cursor: pointer;
            border: 1px solid var(--border); flex-shrink: 0;
        }
        .table-option-toggle::before {
            content: ""; position: absolute; width: 16px; height: 16px;
            left: 2px; top: 2px; border-radius: 50%; background: var(--text-primary);
            transition: transform 120ms ease;
        }
        .table-option-toggle:checked { background: var(--accent); border-color: var(--accent); }
        .table-option-toggle:checked::before { transform: translateX(16px); }

        #tail-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        #tail-status { color: var(--info); font-size: 13px; }

        #main { display: flex; flex: 1; overflow: hidden; position: relative; }

        #facets-sidebar {
            width: var(--sidebar-width, 300px); min-width: 220px; max-width: 640px;
            background: var(--bg-secondary); border-right: 1px solid var(--border);
            overflow-y: auto; flex-shrink: 0; padding: 12px; position: relative;
        }

        body.sidebar-collapsed #facets-sidebar {
            width: 0; min-width: 0; padding: 0; border-right: 0; overflow: hidden;
        }

        #sidebar-resizer {
            position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
            cursor: col-resize; z-index: 10;
        }

        #sidebar-resizer:hover { background: rgba(122, 162, 247, 0.25); }
        body.sidebar-collapsed #sidebar-resizer { display: none; }
        body.resizing-sidebar, body.resizing-sidebar * { cursor: col-resize; user-select: none; }

        #show-sidebar-btn { display: none; }
        body.sidebar-collapsed #show-sidebar-btn { display: inline-block; }

        .sidebar-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

        .sidebar-collapse {
            padding: 2px 8px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 3px; color: var(--text-muted); cursor: pointer; font-size: 11px;
        }

        .sidebar-collapse:hover { color: var(--text-primary); background: var(--border); }

        .sidebar-section { margin-bottom: 16px; }
        .sidebar-section h2 {
            font-size: 12px; text-transform: uppercase; color: var(--text-muted);
            margin-bottom: 8px; letter-spacing: 0.5px;
        }

        .service-item {
            padding: 6px 8px; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
        }
        .service-item:hover { background: var(--bg-tertiary); }

        .service-item input { flex-shrink: 0; }
        .service-name {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
            background: transparent; border: 0; color: var(--text-primary); cursor: pointer;
            font: inherit; font-weight: 600; text-align: left;
        }

        .service-name:hover { color: var(--accent); }
        .service-status {
            font-size: 11px; padding: 1px 6px; border-radius: 3px;
            text-transform: uppercase; font-weight: 500;
        }

        .facet-tools { display: flex; gap: 6px; margin-bottom: 8px; }
        .facet-tools button { flex: 1; }

        .facet-more {
            display: block; margin: 6px 8px 0; background: transparent; border: 0;
            color: var(--accent); cursor: pointer; font-size: 13px; text-align: left;
        }

        .facet-more:hover { text-decoration: underline; }
        .facet-filter {
            width: 100%; padding: 6px 8px; margin-bottom: 8px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-primary); font-size: 13px;
        }

        .facet-divider { border-top: 1px solid var(--border); margin: 14px 0 12px; }

        .status-item {
            padding: 5px 8px; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
        }

        .status-item:hover { background: var(--bg-tertiary); }
        .status-item input { flex-shrink: 0; }
        .status-bar { width: 4px; height: 20px; border-radius: 999px; flex-shrink: 0; }
        .status-label { flex: 1; font-weight: 600; color: var(--text-primary); }
        .status-emergency { background: #8b0015; }
        .status-error { background: var(--error); }
        .status-warn { background: var(--warn); }
        .status-notice { background: #9db2ce; }
        .status-info { background: var(--info); }
        .status-debug { background: #b7bec9; }
        .status-ok { background: #7ee787; }

        .status-running { background: rgba(158, 206, 106, 0.15); color: var(--success); }
        .status-pending { background: rgba(224, 175, 104, 0.15); color: var(--warn); }
        .status-dead { background: rgba(247, 118, 142, 0.15); color: var(--error); }
        .status-complete { background: rgba(158, 206, 106, 0.15); color: var(--success); }
        .status-failed { background: rgba(247, 118, 142, 0.15); color: var(--error); }

        .alloc-item { margin-bottom: 8px; padding-left: 12px; border-left: 2px solid var(--border); }
        .alloc-header { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
        .alloc-name { font-weight: 500; flex: 1; font-size: 13px; }
        .alloc-status {
            font-size: 11px; padding: 1px 6px; border-radius: 3px;
            text-transform: uppercase; font-weight: 500;
        }

        .task-row { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 0 3px 12px; }
        .task-name { font-size: 12px; color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-state { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .task-state-running { color: var(--success); }
        .task-state-dead { color: var(--error); }
        .task-input {
            flex: 1; min-width: 0; padding: 3px 6px; background: var(--bg-primary);
            border: 1px solid var(--border); border-radius: 3px; color: var(--text-primary);
            font-size: 12px;
        }

        .btn-fetch, .btn-tail {
            padding: 2px 8px; font-size: 11px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 3px; color: var(--text-primary);
            cursor: pointer; flex-shrink: 0;
        }
        .btn-fetch:hover, .btn-tail:hover { background: var(--border); }
        .btn-tail { color: var(--info); }

        #content { flex: 1; overflow: auto; padding: 0; }

        #log-table {
            width: var(--log-table-width, 1190px); border-collapse: collapse;
            table-layout: fixed;
            font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
            font-size: 12px;
        }
        #log-table thead { position: sticky; top: 0; background: var(--bg-secondary); z-index: 1; }
        #log-table th {
            position: relative;
            padding: 8px 12px; text-align: left; font-size: 11px;
            text-transform: uppercase; color: var(--text-muted);
            border-bottom: 1px solid var(--border); font-weight: 600;
        }

        .col-time { width: var(--log-col-time-width, 160px); }
        .col-service { width: var(--log-col-service-width, 170px); }
        .col-task { width: var(--log-col-task-width, 100px); }
        .col-message { width: var(--log-col-message-width, 760px); }

        body.hide-log-col-time .col-time,
        body.hide-log-col-time .log-time,
        body.hide-log-col-service .col-service,
        body.hide-log-col-service .log-service,
        body.hide-log-col-task .col-task,
        body.hide-log-col-task .log-task,
        body.hide-log-col-message .col-message,
        body.hide-log-col-message .log-message { display: none; }

        .log-col-resizer {
            position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
            cursor: col-resize; z-index: 2;
        }
        .log-col-resizer:hover { background: rgba(122, 162, 247, 0.25); }
        body.resizing-log-column, body.resizing-log-column * { cursor: col-resize; user-select: none; }

        .log-row { border-bottom: 1px solid rgba(59, 66, 97, 0.3); }
        .log-row[data-log-entry="1"] { cursor: pointer; }
        .log-row:hover { background: var(--bg-secondary); }
        .log-row.selected { background: rgba(122, 162, 247, 0.12); }

        .log-time { padding: 3px 12px; color: var(--text-muted); white-space: nowrap; }

        .log-service { padding: 3px 8px; color: var(--info); white-space: nowrap; }
        .log-task { padding: 3px 8px; color: var(--text-secondary); }
        .log-message { padding: 3px 12px; color: var(--text-primary); word-break: break-all; white-space: pre-wrap; }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .loading { padding: 8px; color: var(--text-muted); }
        .error-msg { color: var(--error); padding: 8px; }

        .level-error .log-message { color: var(--error); }
        .level-warn .log-message, .level-warning .log-message { color: var(--warn); }
        .level-debug .log-message { color: var(--debug); }
        .level-trace .log-message { color: var(--trace); }

        .log-drawer[hidden] { display: none; }
        .log-drawer {
            position: absolute; top: 0; right: 0; bottom: 0; z-index: 30;
            width: min(540px, calc(100vw - 32px)); display: flex; flex-direction: column;
            background: var(--bg-secondary); border-left: 1px solid var(--border);
            box-shadow: -24px 0 80px rgba(0, 0, 0, 0.35);
        }
        .log-drawer-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border);
        }
        .log-drawer-title { font-weight: 700; color: var(--text-primary); }
        .log-drawer-subtitle { margin-top: 4px; color: var(--text-muted); font-size: 12px; }
        .log-drawer-close {
            background: transparent; border: 0; color: var(--text-muted);
            cursor: pointer; font-size: 22px; line-height: 1;
        }
        .log-drawer-close:hover { color: var(--text-primary); }
        .log-drawer-body { overflow-y: auto; padding: 14px 16px 20px; }
        .log-detail-section { margin-bottom: 18px; }
        .log-detail-section h3 {
            margin-bottom: 8px; color: var(--text-muted); font-size: 11px;
            font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .log-detail-field {
            display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr);
            gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(59, 66, 97, 0.55);
        }
        .log-detail-key { color: var(--text-secondary); font-weight: 600; word-break: break-word; }
        .log-detail-value {
            margin: 0; color: var(--text-primary); white-space: pre-wrap;
            word-break: break-word; font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
            font-size: 12px;
        }

        @media (max-width: 720px) {
            .log-drawer { left: 0; width: auto; }
            .log-detail-field { grid-template-columns: 1fr; gap: 4px; }
        }

        .settings-modal[hidden] { display: none; }
        .settings-modal {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10, 11, 20, 0.72);
        }
        .settings-panel {
            width: min(560px, calc(100vw - 32px));
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            padding: 18px;
        }
        .settings-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 14px;
        }
        .settings-header h2 { font-size: 16px; color: var(--text-primary); }
        .settings-close {
            background: transparent; border: 0; color: var(--text-muted);
            cursor: pointer; font-size: 20px; line-height: 1;
        }
        .settings-close:hover { color: var(--text-primary); }
        .settings-label {
            display: block; margin-bottom: 6px; color: var(--text-secondary);
            font-weight: 600; font-size: 13px;
        }
        .settings-all {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
            color: var(--text-primary); font-weight: 600;
        }
        .settings-filter {
            width: 100%; padding: 6px 8px; margin-bottom: 8px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-primary); font-size: 13px;
        }
        .settings-tools { display: flex; gap: 8px; margin-bottom: 8px; }
        .settings-list {
            max-height: min(360px, 44vh); overflow-y: auto;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 4px; padding: 6px;
        }
        .settings-service {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 6px; border-radius: 4px;
        }
        .settings-service:hover { background: var(--bg-tertiary); }
        .settings-service-name { color: var(--text-primary); font-weight: 500; }
        .settings-empty { padding: 12px; color: var(--text-muted); }
        .settings-help { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
        .settings-actions {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 8px; margin-top: 14px;
        }
        .settings-status { color: var(--text-muted); font-size: 13px; margin-right: auto; }
        .settings-status.error { color: var(--error); }
        .settings-status.success { color: var(--success); }
    </style>
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="logo">nomadl</div>
            <button type="button" id="show-sidebar-btn" class="btn-clear" onclick="toggleSidebar(false)">Services</button>
            <form id="search-form">
                <input type="text" name="q" placeholder="Search logs..." class="search-input"
                       oninput="queueSearch()">
                <select name="stream" class="filter-select"
                        onchange="refreshSearch()">
                    <option value="">All Streams</option>
                    <option value="stdout">stdout</option>
                    <option value="stderr" selected>stderr</option>
                </select>
                <button type="button" class="btn-clear" onclick="fetchSelectedServices()">Fetch Selected</button>
                <button type="button" class="btn-clear" onclick="startSelectedTail()">Live Tail Selected</button>
                <button type="button" class="btn-clear"
                        hx-post="/api/clear" hx-target="#log-body"
                        hx-confirm="Clear all stored logs?">Clear</button>
                <button type="button" class="btn-clear"
                        hx-get="/api/diagnostics" hx-target="#log-body">Diagnostics</button>
                <div class="table-options-wrap">
                    <button type="button" class="btn-clear" onclick="toggleTableOptions(event)">Table Options</button>
                    <div id="table-options-menu" class="table-options-menu" hidden onclick="event.stopPropagation()">
                        <div class="table-options-title">Columns</div>
                        <label class="table-option-row">
                            <span>Time</span>
                            <input type="checkbox" class="table-option-toggle" data-log-column="time"
                                   onchange="setLogColumnVisible('time', this.checked)">
                        </label>
                        <label class="table-option-row">
                            <span>Service</span>
                            <input type="checkbox" class="table-option-toggle" data-log-column="service"
                                   onchange="setLogColumnVisible('service', this.checked)">
                        </label>
                        <label class="table-option-row">
                            <span>Task</span>
                            <input type="checkbox" class="table-option-toggle" data-log-column="task"
                                   onchange="setLogColumnVisible('task', this.checked)">
                        </label>
                        <label class="table-option-row">
                            <span>Message</span>
                            <input type="checkbox" class="table-option-toggle" data-log-column="message"
                                   onchange="setLogColumnVisible('message', this.checked)">
                        </label>
                    </div>
                </div>
                <button type="button" class="btn-clear" onclick="openSettings()">Settings</button>
            </form>
            <div id="tail-controls">
                <span id="tail-status"></span>
                <button type="button" id="stop-tail-btn" class="btn-stop-tail"
                        onclick="stopTail()" style="display:none">Stop Tail</button>
            </div>
        </header>
        <div id="main">
            <aside id="facets-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <h2>Service</h2>
                        <button type="button" class="sidebar-collapse" onclick="toggleSidebar(true)">Hide</button>
                    </div>
                    <input class="facet-filter" placeholder="Filter services..." oninput="filterServices(this.value)">
                    <div class="facet-tools">
                        <button type="button" class="btn-fetch" onclick="selectVisibleServices(true)">Select</button>
                        <button type="button" class="btn-fetch" onclick="selectVisibleServices(false)">Clear</button>
                    </div>
                    <div id="job-list" hx-get="/api/jobs" hx-trigger="load" hx-swap="innerHTML">
                        <div class="loading">Loading services...</div>
                    </div>
                    <button type="button" id="service-more-btn" class="facet-more" onclick="toggleServiceExpansion()" style="display:none">View more values</button>
                    <div class="facet-divider"></div>
                    <div class="sidebar-header">
                        <h2>Status</h2>
                    </div>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="emergency" checked onchange="refreshSearch()">
                        <span class="status-bar status-emergency"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'emergency')">Emergency</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="error" checked onchange="refreshSearch()">
                        <span class="status-bar status-error"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'error')">Error</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="warn" checked onchange="refreshSearch()">
                        <span class="status-bar status-warn"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'warn')">Warn</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="notice" checked onchange="refreshSearch()">
                        <span class="status-bar status-notice"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'notice')">Notice</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="info" checked onchange="refreshSearch()">
                        <span class="status-bar status-info"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'info')">Info</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="debug" checked onchange="refreshSearch()">
                        <span class="status-bar status-debug"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'debug')">Debug</span>
                    </label>
                    <label class="status-item">
                        <input type="checkbox" name="status" value="ok" checked onchange="refreshSearch()">
                        <span class="status-bar status-ok"></span>
                        <span class="status-label" onclick="toggleOnlyStatus(event, 'ok')">Ok / Unknown</span>
                    </label>
                </div>
                <div id="sidebar-resizer" onpointerdown="startSidebarResize(event)"></div>
            </aside>
            <main id="content">
                <table id="log-table">
                    <colgroup>
                        <col class="col-time">
                        <col class="col-service">
                        <col class="col-task">
                        <col class="col-message">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="col-time">Time<span class="log-col-resizer" onpointerdown="startLogColumnResize(event, 'time')"></span></th>
                            <th class="col-service">Service<span class="log-col-resizer" onpointerdown="startLogColumnResize(event, 'service')"></span></th>
                            <th class="col-task">Task<span class="log-col-resizer" onpointerdown="startLogColumnResize(event, 'task')"></span></th>
                            <th class="col-message">Message<span class="log-col-resizer" onpointerdown="startLogColumnResize(event, 'message')"></span></th>
                        </tr>
                    </thead>
                    <tbody id="log-body">
                        <tr><td colspan="4" class="empty-state">Ingesting recent logs in the background...</td></tr>
                    </tbody>
                </table>
            </main>
            <section id="log-drawer" class="log-drawer" hidden aria-label="Log details">
                <div class="log-drawer-header">
                    <div>
                        <div id="log-drawer-title" class="log-drawer-title">Log details</div>
                        <div id="log-drawer-subtitle" class="log-drawer-subtitle"></div>
                    </div>
                    <button type="button" class="log-drawer-close" aria-label="Close log details" onclick="closeLogDetails()">&times;</button>
                </div>
                <div id="log-drawer-body" class="log-drawer-body"></div>
            </section>
        </div>
    </div>
    <div id="settings-modal" class="settings-modal" hidden onclick="closeSettingsOnBackdrop(event)">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" class="settings-close" aria-label="Close settings" onclick="closeSettings()">&times;</button>
            </div>
            <div class="settings-label">Services to ingest</div>
            <label class="settings-all">
                <input type="checkbox" id="settings-ingest-all" onchange="toggleSettingsAll()">
                <span>Ingest all running services</span>
            </label>
            <input id="settings-service-filter" class="settings-filter" placeholder="Filter services..."
                   oninput="filterSettingsServices(this.value)">
            <div class="settings-tools">
                <button type="button" class="btn-clear" onclick="setVisibleSettingsServices(true)">Select visible</button>
                <button type="button" class="btn-clear" onclick="setVisibleSettingsServices(false)">Clear visible</button>
            </div>
            <div id="settings-service-list" class="settings-list">
                <div class="settings-empty">Loading services...</div>
            </div>
            <div class="settings-help">Saving with “all” checked stores no allowlist. Otherwise only checked services are ingested.</div>
            <div class="settings-actions">
                <span id="settings-status" class="settings-status"></span>
                <button type="button" class="btn-clear" onclick="closeSettings()">Cancel</button>
                <button type="button" class="btn-clear" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    <script>
        let eventSource = null;
        let searchTimer = null;
        let servicesExpanded = false;
        const serviceVisibleLimit = 12;
        const logColumnDefaults = { time: 160, service: 170, task: 100, message: 760 };
        const logColumnMinimums = { time: 110, service: 120, task: 80, message: 240 };
        const logColumns = Object.keys(logColumnDefaults);

        function logColumnStorageKey(column) {
            return 'nomadl.logColumn.' + column;
        }

        function logColumnVisibilityStorageKey(column) {
            return 'nomadl.logColumn.visible.' + column;
        }

        function logColumnProperty(column) {
            return '--log-col-' + column + '-width';
        }

        function setLogColumnWidth(column, width) {
            const minimum = logColumnMinimums[column] || 60;
            const nextWidth = Math.max(Math.round(width), minimum);
            document.documentElement.style.setProperty(logColumnProperty(column), nextWidth + 'px');
            localStorage.setItem(logColumnStorageKey(column), String(nextWidth));
            updateLogTableWidth();
        }

        function getLogColumnWidth(column) {
            const value = getComputedStyle(document.documentElement).getPropertyValue(logColumnProperty(column));
            const width = parseInt(value, 10);
            if (Number.isFinite(width) && width > 0) {
                return width;
            }
            return logColumnDefaults[column];
        }

        function isLogColumnVisible(column) {
            return localStorage.getItem(logColumnVisibilityStorageKey(column)) !== '0';
        }

        function visibleLogColumns() {
            return logColumns.filter(function(column) { return isLogColumnVisible(column); });
        }

        function ensureVisibleLogColumn() {
            if (visibleLogColumns().length > 0) {
                return;
            }
            localStorage.setItem(logColumnVisibilityStorageKey('message'), '1');
        }

        function updateLogTableWidth() {
            ensureVisibleLogColumn();
            const tableWidth = visibleLogColumns().reduce(function(total, column) {
                return total + getLogColumnWidth(column);
            }, 0);
            document.documentElement.style.setProperty('--log-table-width', tableWidth + 'px');
        }

        function applyLogColumnVisibility() {
            ensureVisibleLogColumn();
            logColumns.forEach(function(column) {
                const visible = isLogColumnVisible(column);
                document.body.classList.toggle('hide-log-col-' + column, !visible);
                const toggle = document.querySelector('[data-log-column="' + column + '"]');
                if (toggle) {
                    toggle.checked = visible;
                }
            });
            updateLogTableWidth();
        }

        function setLogColumnVisible(column, visible) {
            if (!visible && visibleLogColumns().length === 1 && isLogColumnVisible(column)) {
                const toggle = document.querySelector('[data-log-column="' + column + '"]');
                if (toggle) {
                    toggle.checked = true;
                }
                return;
            }
            localStorage.setItem(logColumnVisibilityStorageKey(column), visible ? '1' : '0');
            applyLogColumnVisibility();
        }

        function loadLogColumnWidths() {
            logColumns.forEach(function(column) {
                const saved = parseInt(localStorage.getItem(logColumnStorageKey(column)), 10);
                if (Number.isFinite(saved) && saved > 0) {
                    document.documentElement.style.setProperty(logColumnProperty(column), saved + 'px');
                }
            });
            updateLogTableWidth();
        }

        function loadLogColumnVisibility() {
            applyLogColumnVisibility();
        }

        function toggleTableOptions(event) {
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('table-options-menu');
            menu.hidden = !menu.hidden;
        }

        function closeTableOptions() {
            const menu = document.getElementById('table-options-menu');
            if (menu) {
                menu.hidden = true;
            }
        }

        function startLogColumnResize(event, column) {
            event.preventDefault();
            event.stopPropagation();

            const startX = event.clientX;
            const startWidth = getLogColumnWidth(column);
            document.body.classList.add('resizing-log-column');

            function resize(moveEvent) {
                setLogColumnWidth(column, startWidth + moveEvent.clientX - startX);
            }

            function stopResize() {
                document.body.classList.remove('resizing-log-column');
                document.removeEventListener('pointermove', resize);
                document.removeEventListener('pointerup', stopResize);
            }

            document.addEventListener('pointermove', resize);
            document.addEventListener('pointerup', stopResize);
        }

        function selectedLogRows() {
            return Array.from(document.querySelectorAll('#log-body .log-row.selected'));
        }

        function closeLogDetails() {
            document.getElementById('log-drawer').hidden = true;
            selectedLogRows().forEach(function(row) { row.classList.remove('selected'); });
        }

        function parseLogJSON(raw) {
            const trimmed = raw.trim();
            if (!trimmed) {
                return { ok: false };
            }
            try {
                return { ok: true, value: JSON.parse(trimmed) };
            } catch (error) {
                return { ok: false };
            }
        }

        function formatLogDetailValue(value) {
            if (value === undefined) {
                return '';
            }
            if (value === null) {
                return 'null';
            }
            if (typeof value === 'string') {
                return value;
            }
            if (typeof value === 'object') {
                return JSON.stringify(value, null, 2);
            }
            return String(value);
        }

        function appendLogDetailSection(container, title, fields) {
            if (!fields.length) {
                return;
            }

            const section = document.createElement('section');
            section.className = 'log-detail-section';

            const heading = document.createElement('h3');
            heading.textContent = title;
            section.appendChild(heading);

            fields.forEach(function(field) {
                const row = document.createElement('div');
                row.className = 'log-detail-field';

                const key = document.createElement('div');
                key.className = 'log-detail-key';
                key.textContent = field[0];

                const value = document.createElement('pre');
                value.className = 'log-detail-value';
                value.textContent = formatLogDetailValue(field[1]);

                row.appendChild(key);
                row.appendChild(value);
                section.appendChild(row);
            });

            container.appendChild(section);
        }

        function openLogDetails(row) {
            selectedLogRows().forEach(function(selected) { selected.classList.remove('selected'); });
            row.classList.add('selected');

            const data = row.dataset;
            const raw = data.logRaw || data.logMessage || '';
            const message = data.logMessage || raw;
            const service = data.logService || 'unknown service';
            const task = data.logTask || 'unknown task';
            const title = service + (task ? ' / ' + task : '');
            const subtitle = [data.logTime, data.logLevel, data.logStream]
                .filter(function(value) { return value; })
                .join(' | ');
            const body = document.getElementById('log-drawer-body');

            document.getElementById('log-drawer-title').textContent = title;
            document.getElementById('log-drawer-subtitle').textContent = subtitle;
            body.textContent = '';

            appendLogDetailSection(body, 'Metadata', [
                ['time', data.logTime || ''],
                ['service', data.logService || ''],
                ['task', data.logTask || ''],
                ['level', data.logLevel || ''],
                ['stream', data.logStream || ''],
                ['id', data.logId || '']
            ].filter(function(field) { return field[1]; }));

            const parsed = parseLogJSON(raw);
            if (parsed.ok && parsed.value !== null && typeof parsed.value === 'object' && !Array.isArray(parsed.value)) {
                appendLogDetailSection(body, 'JSON Fields', Object.keys(parsed.value).sort().map(function(key) {
                    return [key, parsed.value[key]];
                }));
            } else if (parsed.ok) {
                appendLogDetailSection(body, 'JSON Value', [['value', parsed.value]]);
            } else {
                appendLogDetailSection(body, 'Message', [['message', message]]);
            }

            appendLogDetailSection(body, 'Raw', [['raw', raw || message]]);
            document.getElementById('log-drawer').hidden = false;
        }

        function setSettingsStatus(message, kind) {
            const status = document.getElementById('settings-status');
            status.textContent = message;
            status.className = 'settings-status' + (kind ? ' ' + kind : '');
        }

        function settingsServiceInputs() {
            return Array.from(document.querySelectorAll('#settings-service-list input[name="settings-service"]'));
        }

        function renderSettingsServices(settings) {
            const selected = new Set(settings.ingest_services || []);
            const allMode = selected.size === 0;
            const services = settings.available_services || [];
            const list = document.getElementById('settings-service-list');
            list.innerHTML = '';

            document.getElementById('settings-ingest-all').checked = allMode;
            if (services.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'settings-empty';
                empty.textContent = 'No running services found.';
                list.appendChild(empty);
                return;
            }

            services.forEach(function(service) {
                const label = document.createElement('label');
                label.className = 'settings-service';

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.name = 'settings-service';
                input.value = service;
                input.checked = allMode || selected.has(service);

                const name = document.createElement('span');
                name.className = 'settings-service-name';
                name.textContent = service;

                label.appendChild(input);
                label.appendChild(name);
                list.appendChild(label);
            });
            applySettingsAllMode();
            filterSettingsServices(document.getElementById('settings-service-filter').value);
        }

        function applySettingsAllMode() {
            const allMode = document.getElementById('settings-ingest-all').checked;
            settingsServiceInputs().forEach(function(input) {
                input.disabled = allMode;
                if (allMode) {
                    input.checked = true;
                }
            });
        }

        function toggleSettingsAll() {
            applySettingsAllMode();
        }

        function setVisibleSettingsServices(checked) {
            if (document.getElementById('settings-ingest-all').checked) {
                return;
            }
            document.querySelectorAll('#settings-service-list .settings-service').forEach(function(row) {
                if (row.style.display === 'none') {
                    return;
                }
                const input = row.querySelector('input[name="settings-service"]');
                if (input) {
                    input.checked = checked;
                }
            });
        }

        function filterSettingsServices(query) {
            query = query.toLowerCase();
            document.querySelectorAll('#settings-service-list .settings-service').forEach(function(row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        function openSettings() {
            setSettingsStatus('Loading...', '');
            document.getElementById('settings-modal').hidden = false;
            fetch('/api/settings')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Settings failed: HTTP ' + response.status);
                    }
                    return response.json();
                })
                .then(function(settings) {
                    renderSettingsServices(settings);
                    setSettingsStatus('', '');
                    document.getElementById('settings-service-filter').focus();
                })
                .catch(function(error) { setSettingsStatus(error.message, 'error'); });
        }

        function closeSettings() {
            document.getElementById('settings-modal').hidden = true;
        }

        function closeSettingsOnBackdrop(event) {
            if (event.target.id === 'settings-modal') {
                closeSettings();
            }
        }

        function refreshJobs() {
            fetch('/api/jobs')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Service refresh failed: HTTP ' + response.status);
                    }
                    return response.text();
                })
                .then(function(html) {
                    document.getElementById('job-list').innerHTML = html;
                    servicesExpanded = false;
                    applyServiceLimit();
                    refreshSearch();
                })
                .catch(function(error) { setSettingsStatus(error.message, 'error'); });
        }

        function saveSettings() {
            let services = [];
            if (!document.getElementById('settings-ingest-all').checked) {
                services = settingsServiceInputs()
                    .filter(function(input) { return input.checked; })
                    .map(function(input) { return input.value; });
                if (services.length === 0) {
                    setSettingsStatus('Select at least one service or enable all services.', 'error');
                    return;
                }
            }
            setSettingsStatus('Saving...', '');
            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ingest_services: services })
            })
                .then(function(response) {
                    if (!response.ok) {
                        return response.json().then(function(body) {
                            throw new Error(body.error || ('Save failed: HTTP ' + response.status));
                        });
                    }
                    return response.json();
                })
                .then(function(settings) {
                    if (settings.available_services) {
                        renderSettingsServices(settings);
                    }
                    setSettingsStatus('Saved', 'success');
                    refreshJobs();
                    closeSettings();
                })
                .catch(function(error) { setSettingsStatus(error.message, 'error'); });
        }

        function selectedServices() {
            return Array.from(document.querySelectorAll('#job-list input[name="service"]:checked'))
                .map(function(input) { return input.value; });
        }

        function selectedStatuses() {
            return Array.from(document.querySelectorAll('input[name="status"]:checked'))
                .map(function(input) { return input.value; });
        }

        function statusCheckboxes() {
            return Array.from(document.querySelectorAll('input[name="status"]'));
        }

        function toggleOnlyStatus(event, status) {
            event.preventDefault();
            event.stopPropagation();
            const boxes = statusCheckboxes();
            const checked = boxes.filter(function(input) { return input.checked; });
            const onlyThis = checked.length === 1 && checked[0].value === status;
            boxes.forEach(function(input) { input.checked = onlyThis || input.value === status; });
            refreshSearch();
        }

        function appendSelectedStatuses(params) {
            params.set('status_filter', '1');
            selectedStatuses().forEach(function(status) { params.append('status', status); });
        }

        function serviceCheckboxes() {
            return Array.from(document.querySelectorAll('#job-list input[name="service"]'));
        }

        function toggleOnlyService(service) {
            const boxes = serviceCheckboxes();
            const checked = boxes.filter(function(input) { return input.checked; });
            const onlyThis = checked.length === 1 && checked[0].value === service;
            boxes.forEach(function(input) { input.checked = onlyThis || input.value === service; });
            refreshSearch();
        }

        function selectedServiceParams() {
            const params = new URLSearchParams();
            params.set('service_filter', '1');
            selectedServices().forEach(function(service) { params.append('service', service); });
            appendSelectedStatuses(params);
            return params;
        }

        function searchParams() {
            const params = new URLSearchParams(new FormData(document.getElementById('search-form')));
            params.set('service_filter', '1');
            selectedServices().forEach(function(service) { params.append('service', service); });
            appendSelectedStatuses(params);
            return params;
        }

        function queueSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(refreshSearch, 250);
        }

        function refreshSearch() {
            const params = searchParams();
            fetch('/api/search?' + params.toString())
                .then(function(response) { return response.text(); })
                .then(function(html) { document.getElementById('log-body').innerHTML = html; })
                .catch(function(error) {
                    document.getElementById('log-body').innerHTML = '<tr><td colspan="4" class="error-msg">Search failed: ' + error + '</td></tr>';
                });
        }

        function fetchSelectedServices() {
            stopTail();
            const params = searchParams();
            if (!params.has('service')) {
                document.getElementById('log-body').innerHTML = '<tr><td colspan="4" class="empty-state">Select at least one service.</td></tr>';
                return;
            }
            document.getElementById('log-body').innerHTML = '<tr><td colspan="4" class="empty-state">Fetching selected services...</td></tr>';
            fetch('/api/fetch-selected?' + params.toString(), { method: 'POST' })
                .then(function(response) { return response.text(); })
                .then(function(html) { document.getElementById('log-body').innerHTML = html; })
                .catch(function(error) {
                    document.getElementById('log-body').innerHTML = '<tr><td colspan="4" class="error-msg">Fetch failed: ' + error + '</td></tr>';
                });
        }

        function startSelectedTail() {
            stopTail();
            const params = searchParams();
            const services = selectedServices();
            if (!params.has('service')) {
                document.getElementById('log-body').innerHTML = '<tr><td colspan="4" class="empty-state">Select at least one service.</td></tr>';
                return;
            }
            document.getElementById('tail-status').textContent = 'Tailing ' + services.length + ' services';
            document.getElementById('stop-tail-btn').style.display = '';
            document.getElementById('log-body').innerHTML = '';
            eventSource = new EventSource('/api/stream-selected?' + params.toString());
            eventSource.addEventListener('log', function(e) {
                document.getElementById('log-body').insertAdjacentHTML('afterbegin', e.data);
            });
            eventSource.addEventListener('error', function(e) {
                if (e.data) {
                    document.getElementById('log-body').insertAdjacentHTML('afterbegin',
                        '<tr class="log-row"><td colspan="4" class="error-msg">' + e.data + '</td></tr>');
                }
            });
            eventSource.onerror = function() {
                stopTail();
            };
        }

        function stopTail() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            document.getElementById('tail-status').textContent = '';
            document.getElementById('stop-tail-btn').style.display = 'none';
        }

        function selectVisibleServices(checked) {
            document.querySelectorAll('#job-list .service-item').forEach(function(row) {
                if (row.style.display === 'none') {
                    return;
                }
                const input = row.querySelector('input[name="service"]');
                if (input) {
                    input.checked = checked;
                }
            });
            refreshSearch();
        }

        function visibleServiceRows() {
            return Array.from(document.querySelectorAll('#job-list .service-item'));
        }

        function applyServiceLimit() {
            const query = document.querySelector('.facet-filter').value.toLowerCase();
            const rows = visibleServiceRows();
            const matchingRows = rows.filter(function(row) {
                return row.textContent.toLowerCase().includes(query);
            });
            const shouldLimit = !servicesExpanded && query === '';

            rows.forEach(function(row) { row.style.display = 'none'; });
            matchingRows.forEach(function(row, index) {
                row.style.display = shouldLimit && index >= serviceVisibleLimit ? 'none' : '';
            });

            const moreButton = document.getElementById('service-more-btn');
            if (!moreButton) {
                return;
            }
            moreButton.style.display = query === '' && rows.length > serviceVisibleLimit ? '' : 'none';
            moreButton.textContent = servicesExpanded ? 'Show fewer values' : 'View more values';
        }

        function toggleServiceExpansion() {
            servicesExpanded = !servicesExpanded;
            applyServiceLimit();
        }

        function toggleSidebar(collapsed) {
            document.body.classList.toggle('sidebar-collapsed', collapsed);
            localStorage.setItem('nomadl.sidebarCollapsed', collapsed ? '1' : '0');
        }

        function startSidebarResize(event) {
            event.preventDefault();
            toggleSidebar(false);
            document.body.classList.add('resizing-sidebar');

            function resize(moveEvent) {
                const width = Math.min(Math.max(moveEvent.clientX, 220), 640);
                document.documentElement.style.setProperty('--sidebar-width', width + 'px');
                localStorage.setItem('nomadl.sidebarWidth', String(width));
            }

            function stopResize() {
                document.body.classList.remove('resizing-sidebar');
                document.removeEventListener('pointermove', resize);
                document.removeEventListener('pointerup', stopResize);
            }

            document.addEventListener('pointermove', resize);
            document.addEventListener('pointerup', stopResize);
        }

        function filterServices(query) {
            applyServiceLimit();
        }

        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.target.id === 'job-list') {
                applyServiceLimit();
                setTimeout(refreshSearch, 1000);
            }
        });

        document.getElementById('log-body').addEventListener('click', function(event) {
            if (!event.target.closest) {
                return;
            }
            const row = event.target.closest('.log-row[data-log-entry="1"]');
            if (!row) {
                return;
            }
            openLogDetails(row);
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && !document.getElementById('log-drawer').hidden) {
                closeLogDetails();
            }
        });

        document.addEventListener('click', closeTableOptions);

        setInterval(function() {
            if (!eventSource) {
                refreshSearch();
            }
        }, 5000);

        const storedSidebarWidth = localStorage.getItem('nomadl.sidebarWidth');
        if (storedSidebarWidth) {
            document.documentElement.style.setProperty('--sidebar-width', storedSidebarWidth + 'px');
        }
        if (localStorage.getItem('nomadl.sidebarCollapsed') === '1') {
            document.body.classList.add('sidebar-collapsed');
        }
        loadLogColumnWidths();
        loadLogColumnVisibility();
    </script>
</body>
</html>
