name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set build vars
        id: vars
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build and package
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist

          LDFLAGS="-s -w -X main.Version=${VERSION}"

          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in ${targets}; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "Building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" \
              go build -ldflags "${LDFLAGS}" -o "build/nomadl-${goos}-${goarch}" .
          done

          # Package Linux binaries with nfpm
          for arch in amd64 arm64; do
            bin="build/nomadl-linux-${arch}"

            printf '%s\n' \
              'name: nomadl' \
              "arch: \"${arch}\"" \
              'platform: "linux"' \
              "version: \"${VERSION}\"" \
              'maintainer: "Roberto Selbach <roberto@selbach.com>"' \
              'description: "Terminal UI for browsing Nomad services and tailing task logs"' \
              'homepage: "https://github.com/rselbach/nomadl"' \
              'license: "MIT"' \
              'section: "utils"' \
              'priority: "optional"' \
              'contents:' \
              "  - src: ${bin}" \
              '    dst: /usr/bin/nomadl' \
              > nfpm.yaml

            nfpm package -f nfpm.yaml -p deb    -t "dist/nomadl_${VERSION}_${arch}.deb"
            nfpm package -f nfpm.yaml -p rpm    -t "dist/nomadl-${VERSION}.${arch}.rpm"
            nfpm package -f nfpm.yaml -p archlinux -t "dist/nomadl-${VERSION}-${arch}.pkg.tar.zst"
            rm nfpm.yaml
          done

          # AppImage (amd64)
          arch="x86_64"
          bin="build/nomadl-linux-amd64"
          mkdir -p AppDir/usr/bin

          cp "${bin}" AppDir/usr/bin/nomadl

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Nomad Logs' \
            'Comment=Terminal UI for browsing Nomad services and tailing logs' \
            'Exec=nomadl' \
            'Icon=nomadl' \
            'Terminal=true' \
            'Categories=Utility;' \
            > AppDir/nomadl.desktop

          printf '%s\n' \
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">' \
            '<rect width="256" height="256" rx="48" fill="#1f2937"/>' \
            '<path d="M56 72h144v112H56z" fill="#111827"/>' \
            '<path d="M80 104h96M80 128h72M80 152h48" stroke="#34d399" stroke-width="14" stroke-linecap="round"/>' \
            '</svg>' \
            > AppDir/nomadl.svg

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "${0}")")"' \
            'export PATH="${HERE}/usr/bin:${PATH}"' \
            'exec "${HERE}/usr/bin/nomadl" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${arch}.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null

          ARCH="${arch}" ./squashfs-root/AppRun AppDir "dist/nomadl-${VERSION}-${arch}.AppImage"
          rm -rf AppDir appimagetool.AppImage squashfs-root

          # Zip macOS binaries
          for arch in amd64 arm64; do
            mkdir -p "build/darwin-${arch}"
            cp "build/nomadl-darwin-${arch}" "build/darwin-${arch}/nomadl"
            zip -j "dist/nomadl-${VERSION}-darwin-${arch}.zip" "build/darwin-${arch}/nomadl"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.vars.outputs.version }}
          body: |
            ## Installation

            ### Linux
            - **Debian/Ubuntu**: `dpkg -i nomadl_*.deb`
            - **Fedora/RHEL**: `rpm -i nomadl-*.rpm`
            - **Arch Linux**: `pacman -U nomadl-*.pkg.tar.zst`
            - **Universal**: Download and run the `.AppImage`

            ### macOS
            ```sh
            unzip nomadl-*-darwin-*.zip
            mv nomadl /usr/local/bin/
            ```
          files: dist/*
          generate_release_notes: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: rselbach/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          ref: main

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          amd64_sha="$(awk -v file="./nomadl-${VERSION}-darwin-amd64.zip" '$2 == file { print $1 }' dist/checksums.txt)"
          arm64_sha="$(awk -v file="./nomadl-${VERSION}-darwin-arm64.zip" '$2 == file { print $1 }' dist/checksums.txt)"

          if [ -z "${amd64_sha}" ] || [ -z "${arm64_sha}" ]; then
            echo "Missing macOS zip checksums in dist/checksums.txt" >&2
            exit 1
          fi

          cat > homebrew-tap/nomadl.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Nomadl < Formula
            desc "Terminal UI for browsing Nomad services and tailing task logs"
            homepage "https://github.com/rselbach/nomadl"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/rselbach/nomadl/releases/download/v#{version}/nomadl-#{version}-darwin-amd64.zip"
                sha256 "${amd64_sha}"
              end

              if Hardware::CPU.arm?
                url "https://github.com/rselbach/nomadl/releases/download/v#{version}/nomadl-#{version}-darwin-arm64.zip"
                sha256 "${arm64_sha}"
              end
            end

            def install
              bin.install "nomadl"
            end

            test do
              assert_match "nomadl #{version}", shell_output("#{bin}/nomadl --version")
            end
          end
          FORMULA

          cd homebrew-tap
          ruby -c nomadl.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nomadl.rb

          if git diff --cached --quiet -- nomadl.rb; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git commit -m "Update nomadl formula to v${VERSION}"
          git push
