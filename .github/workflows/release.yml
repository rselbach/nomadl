name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go test ./...
          go vet ./...

      - name: Set build vars
        id: vars
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build and package
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build dist

          LDFLAGS="-s -w -X main.version=${VERSION}"

          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in ${targets}; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "Building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" \
              go build -ldflags "${LDFLAGS}" -o "build/nomadl-${goos}-${goarch}" .
          done

          # Package Linux binaries with nfpm
          for arch in amd64 arm64; do
            bin="build/nomadl-linux-${arch}"

            printf '%s\n' \
              'name: nomadl' \
              "arch: \"${arch}\"" \
              'platform: "linux"' \
              "version: \"${VERSION}\"" \
              'maintainer: "Roberto Selbach <roberto@selbach.com>"' \
              'description: "Local browser UI for searching Nomad logs with SQLite ingestion"' \
              'homepage: "https://github.com/rselbach/nomadl"' \
              'license: "MIT"' \
              'section: "utils"' \
              'priority: "optional"' \
              'contents:' \
              "  - src: ${bin}" \
              '    dst: /usr/bin/nomadl' \
              > nfpm.yaml

            nfpm package -f nfpm.yaml -p deb    -t "dist/nomadl_${VERSION}_${arch}.deb"
            nfpm package -f nfpm.yaml -p rpm    -t "dist/nomadl-${VERSION}.${arch}.rpm"
            nfpm package -f nfpm.yaml -p archlinux -t "dist/nomadl-${VERSION}-${arch}.pkg.tar.zst"
            rm nfpm.yaml
          done

          # AppImage (amd64)
          arch="x86_64"
          bin="build/nomadl-linux-amd64"
          mkdir -p AppDir/usr/bin

          cp "${bin}" AppDir/usr/bin/nomadl

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=nomadl' \
            'Comment=Local browser UI for searching Nomad logs' \
            'Exec=nomadl' \
            'Icon=nomadl' \
            'Terminal=true' \
            'Categories=Utility;' \
            > AppDir/nomadl.desktop

          printf '%s\n' \
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">' \
            '<rect width="256" height="256" rx="48" fill="#1f2937"/>' \
            '<path d="M56 72h144v112H56z" fill="#111827"/>' \
            '<path d="M80 104h96M80 128h72M80 152h48" stroke="#34d399" stroke-width="14" stroke-linecap="round"/>' \
            '</svg>' \
            > AppDir/nomadl.svg

          printf '%s\n' \
            "#!/bin/sh" \
            "HERE=\"\$(dirname \"\$(readlink -f \"\${0}\")\")\"" \
            "export PATH=\"\${HERE}/usr/bin:\${PATH}\"" \
            "exec \"\${HERE}/usr/bin/nomadl\" \"\$@\"" \
            > AppDir/AppRun
          chmod +x AppDir/AppRun

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${arch}.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null

          ARCH="${arch}" ./squashfs-root/AppRun AppDir "dist/nomadl-${VERSION}-${arch}.AppImage"
          rm -rf AppDir appimagetool.AppImage squashfs-root

          # Zip macOS binaries
          for arch in amd64 arm64; do
            mkdir -p "build/darwin-${arch}"
            cp "build/nomadl-darwin-${arch}" "build/darwin-${arch}/nomadl"
            zip -j "dist/nomadl-${VERSION}-darwin-${arch}.zip" "build/darwin-${arch}/nomadl"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pi
        run: npm -g install @mariozechner/pi-coding-agent@0.70.2

      - name: Build release notes input
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(
            git tag --merged "${GITHUB_SHA}^" --sort=-version:refname 2>/dev/null |
              grep -E '^v[0-9]+' |
              head -n1 ||
              true
          )"

          if [ -n "${previous_tag}" ]; then
            log_range="${previous_tag}..${current_tag}"
            diff_base="${previous_tag}"
            previous_version="${previous_tag}"
          else
            log_range="${current_tag}"
            diff_base="$(git hash-object -t tree /dev/null)"
            previous_version="none"
          fi

          {
            sed '/^## Example Change Context$/,$d' .github/release-notes-prompt.md
            echo
            echo "Use the actual release input below. Ignore any example input above."
            echo
            echo "Project:"
            echo "nomadl"
            echo
            echo "Previous version:"
            echo "${previous_version}"
            echo
            echo "New version:"
            echo "${current_tag}"
            echo
            echo "Git range:"
            echo "${log_range}"
            echo
            echo "Commits:"
            git log --reverse --format='- %s (%h)' "${log_range}"
            echo
            echo "Changed files:"
            git diff --name-status "${diff_base}" "${current_tag}"
            echo
            echo "Diffstat:"
            git diff --stat "${diff_base}" "${current_tag}"
          } > build/release-notes-input.md

      - name: Generate release notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -euo pipefail

          pi \
            --provider deepseek \
            --model deepseek-v4-flash \
            --thinking off \
            --no-tools \
            --no-session \
            --no-context-files \
            --no-extensions \
            --no-skills \
            --no-prompt-templates \
            --no-themes \
            -p "Generate the release notes from stdin. Return only Markdown." \
            < build/release-notes-input.md \
            > build/release-notes.md

          test -s build/release-notes.md

          cat >> build/release-notes.md <<'INSTALLATION'

          ## Installation

          ### macOS

          ```sh
          brew install rselbach/tap/nomadl
          ```

          Manual macOS binaries are also available as `darwin-amd64` and
          `darwin-arm64` zip assets.

          ### Linux

          - **Debian/Ubuntu**: `dpkg -i nomadl_*.deb`
          - **Fedora/RHEL**: `rpm -i nomadl-*.rpm`
          - **Arch Linux**: `pacman -U nomadl-*.pkg.tar.zst`
          - **Universal**: Download and run the `.AppImage`
          INSTALLATION

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.vars.outputs.version }}
          body_path: build/release-notes.md
          files: dist/*

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: rselbach/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          ref: main

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail

          amd64_sha="$(awk -v file="./nomadl-${VERSION}-darwin-amd64.zip" '$2 == file { print $1 }' dist/checksums.txt)"
          arm64_sha="$(awk -v file="./nomadl-${VERSION}-darwin-arm64.zip" '$2 == file { print $1 }' dist/checksums.txt)"

          if [ -z "${amd64_sha}" ] || [ -z "${arm64_sha}" ]; then
            echo "Missing macOS zip checksums in dist/checksums.txt" >&2
            exit 1
          fi

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/nomadl.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Nomadl < Formula
            desc "Local browser UI for searching Nomad logs"
            homepage "https://github.com/rselbach/nomadl"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/rselbach/nomadl/releases/download/v#{version}/nomadl-#{version}-darwin-amd64.zip"
                sha256 "${amd64_sha}"
              end

              if Hardware::CPU.arm?
                url "https://github.com/rselbach/nomadl/releases/download/v#{version}/nomadl-#{version}-darwin-arm64.zip"
                sha256 "${arm64_sha}"
              end
            end

            def install
              bin.install "nomadl"
            end

            test do
              assert_match "nomadl #{version}", shell_output("#{bin}/nomadl --version")
            end
          end
          FORMULA

          cd homebrew-tap
          ruby -c Formula/nomadl.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/nomadl.rb

          if git diff --cached --quiet -- Formula/nomadl.rb; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git commit -m "Update nomadl formula to v${VERSION}"
          git push
